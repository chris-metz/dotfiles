include dark-theme.auto.conf
map ctrl+v paste_from_clipboard
allow_remote_control yes
map ctrl+alt+shift+t set_tab_title " "
font_size 12


# BEGIN_KITTY_FONTS
font_family      family="UbuntuMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

include current-host.conf
