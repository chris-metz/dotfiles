# kitty
# https://sw.kovidgoyal.net/kitty/conf/

map ctrl+v paste_from_clipboard
allow_remote_control yes
map ctrl+alt+shift+t set_tab_title " "

font_size 12

# BEGIN_KITTY_FONTS
font_family      family="Agave Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# --------------------------------------------------------------------------
# Taken over from the hyprmc repo on 2026-09-08, when kitty moved from there
# to here. These three came out of the CachyOS installer state and were kept
# deliberately -- they were never a decision, but they were not unwanted
# either. See hyprmc/DECISIONS.md.

# Slightly see-through windows. Needs a compositor with blur or a calm
# background, otherwise the text gets restless.
background_opacity          0.8

# The cursor trail: when the cursor jumps far, it visibly drags behind. That
# is kitty, not the compositor. The value is a time in milliseconds: the
# trail only appears for a cursor that sat still for that long beforehand,
# which suppresses trails from programs that throw it around while drawing.
#
#   cursor_trail_decay            0.1 0.4   fastest/slowest decay
#   cursor_trail_start_threshold  2         from how many cells of jump
cursor_trail                1

# Padding between the window edge and the text.
window_padding_width        5

# Colours: deliberately none, kitty uses its built-in ones. The colour scheme
# is still an open question in hyprmc (its bar and overlay sit on placeholders);
# when it is decided, it lands here too.
#
# NOTE: do not "include dark-theme.auto.conf" here. kitty picks up
# dark-theme.auto.conf / light-theme.auto.conf / no-preference-theme.auto.conf
# by itself as soon as they exist, and following the OS colour scheme. Those
# files are written by "kitten themes" and are machine-local, which is why
# they are not in this repo. The include line was here until 2026-09-08 and
# only ever produced a warning about a missing file.


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
