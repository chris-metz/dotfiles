# kitty
# https://sw.kovidgoyal.net/kitty/conf/

map ctrl+v paste_from_clipboard
allow_remote_control yes
map ctrl+alt+shift+t set_tab_title " "

font_size 13

# BEGIN_KITTY_FONTS
font_family      family="Agave Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# --------------------------------------------------------------------------
# Taken over from the hyprmc repo on 2026-09-08, when kitty moved from there
# to here. These three came out of the CachyOS installer state and were kept
# deliberately -- they were never a decision, but they were not unwanted
# either. See hyprmc/DECISIONS.md.

# Slightly see-through windows. Needs a compositor with blur or a calm
# background, otherwise the text gets restless.
background_opacity          0.8

# The cursor trail: when the cursor jumps far, it visibly drags behind. That
# is kitty, not the compositor. The value is a time in milliseconds: the
# trail only appears for a cursor that sat still for that long beforehand,
# which suppresses trails from programs that throw it around while drawing.
#
#   cursor_trail_decay            0.1 0.4   fastest/slowest decay
#   cursor_trail_start_threshold  2         from how many cells of jump
cursor_trail                1

# Padding between the window edge and the text.
window_padding_width        5

# Colours. current-theme.conf is a full copy of the palette, written by
# "kitten themes" and committed alongside this file -- it is NOT generated on
# checkout. That is deliberate: kitty has no "theme X" directive and ships no
# themes of its own. The kitten downloads a ~550 KB zip from GitHub and caches
# it under ~/.cache/kitty. Without the file in the repo, a fresh machine gets
# kitty's built-in colours and someone has to remember which theme this was.
#
# So: to change the theme run "kitten themes", which rewrites
# current-theme.conf and the block below, then commit both.
#
# The counterpart -- naming the files dark-theme.auto.conf and
# light-theme.auto.conf instead, which kitty then picks by itself following
# the OS colour scheme, with no include line at all -- is the better shape
# once light and dark are both chosen. It needs no include; an include of a
# missing file is what produced a warning here until 2026-09-08.


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
