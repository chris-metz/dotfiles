onboarding = false

[keys]
prefix = "ctrl+a"

# tmux-Logik: % teilt nebeneinander, " uebereinander
# (herdr nennt die Richtungen umgekehrt)
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"

# Prefix-freie Pane-Navigation. alt+shift statt ctrl+alt, weil ctrl+alt auf
# deutschem Layout als AltGr interpretiert und vom Layout geschluckt wird.
focus_pane_left = ["prefix+h", "alt+shift+h"]
focus_pane_down = ["prefix+j", "alt+shift+j"]
focus_pane_up = ["prefix+k", "alt+shift+k"]
focus_pane_right = ["prefix+l", "alt+shift+l"]

# Prefix-freier Tabwechsel. Ziffern sind auf deutschem Layout unshifted,
# alt+1..9 kommt also sauber durch. prefix+1..9 bleibt als Default erhalten.
switch_tab = ["prefix+1..9", "alt+1..9"]

# Prefix-freier Workspace-Wechsel, gleiche Modifier-Familie wie die
# Pane-Navigation. n/p wie prefix+n/prefix+p bei den Tabs (tmux-Logik);
# alt+shift+left/right bleibt frei fuer move_tab_previous/next.
next_workspace = ["alt+shift+n", "alt+shift+down"]
previous_workspace = ["alt+shift+p", "alt+shift+up"]

# Navigate-Mode (prefix+w): Vim-Tasten fuer die Workspace-Auswahl, zusaetzlich
# zu den Pfeiltasten. j/k sind dort per Default die Pane-Navigation — die wird
# hier geleert, weil Panes ohnehin ueber alt+shift+h/j/k/l erreichbar sind.
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
navigate_pane_up = ""
navigate_pane_down = ""

# Ohne diesen Block gilt der Default delivery = "off" — Herdr lehnt dann jede
# Zustellung ab (notification show meldet reason "disabled"), inklusive Sound.
# "terminal" laesst Windows Terminal eine echte Windows-Desktop-Notification
# zeigen; "system" wuerde einen Linux-Notification-Daemon erwarten, den es
# unter WSL2 hier nicht gibt.
[ui.toast]
delivery = "terminal"

# Greift nur fuer Workspaces, die in der Herdr-UI im Hintergrund liegen.
# Aus dem Terminal-Fenster klicken reicht nicht — dafuer den Workspace wechseln.
[ui.sound]
enabled = true

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"
